<!DOCTYPE html>
<html lang="es-AR" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finance OS</title>
  <script>
    // Aplica el tema guardado antes de pintar, para que no haya un flash del tema equivocado.
    (function () {
      try {
        var t = localStorage.getItem('fos-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
</head>
<body class="bg-bg text-txt font-sans antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
